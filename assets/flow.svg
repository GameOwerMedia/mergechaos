<path d="M472,374 C496,374 496,246 520,246" class="wire" marker-end="url(#arrow)"/>
<rect x="780" y="84" width="296" height="150" rx="8" class="card" />
<text x="796" y="108" font-size="13" class="mono h" >merge/&lt;stamp&gt;</text>
<text x="796" y="126" font-size="11.5" class="muted" >in &lt;run&gt;/wt/acme-shop, base untouched</text>
<line x1="812" y1="176" x2="1040" y2="176" stroke-width="2" style="stroke:var(--blue)"/>
<circle cx="812" cy="176" r="7" stroke-width="2" style="fill:var(--card);stroke:var(--blue)"/>
<text x="812" y="204" font-size="11" class="mono muted" text-anchor="middle">base</text>
<circle cx="872" cy="176" r="7" stroke-width="2" style="fill:var(--card);stroke:var(--blue)"/>
<text x="872" y="204" font-size="11" class="mono muted" text-anchor="middle">a</text>
<circle cx="932" cy="176" r="7" stroke-width="2" style="fill:var(--card);stroke:var(--blue)"/>
<text x="932" y="204" font-size="11" class="mono muted" text-anchor="middle">b</text>
<circle cx="992" cy="176" r="7" stroke-width="2" style="fill:var(--card);stroke:var(--blue)"/>
<text x="992" y="204" font-size="11" class="mono muted" text-anchor="middle">c</text>
<circle cx="1048" cy="176" r="0" stroke-width="2" style="fill:var(--card);stroke:var(--blue)"/>
<text x="1048" y="204" font-size="11" class="mono muted" text-anchor="middle">tests</text>
<rect x="1018" y="166" width="50" height="20" rx="10" stroke-width="1" style="fill:var(--green-bg);stroke:var(--green)"/><text x="1043" y="180" font-size="11" text-anchor="middle" class="h" style="fill:var(--green)">pass</text>
<rect x="780" y="256" width="296" height="150" rx="8" class="card" />
<text x="796" y="280" font-size="13" class="h" >land on main</text>
<text x="796" y="298" font-size="11.5" class="muted" >disk compared path by path</text>
<rect x="796" y="314" width="78" height="20" rx="10" stroke-width="1" style="fill:var(--blue-bg);stroke:var(--blue)"/><text x="835" y="328" font-size="11" text-anchor="middle" class="h" style="fill:var(--blue)">EQUAL</text>
<text x="884" y="329" font-size="12" class="" >already on disk: skip</text>
<rect x="796" y="342" width="78" height="20" rx="10" stroke-width="1" style="fill:var(--green-bg);stroke:var(--green)"/><text x="835" y="356" font-size="11" text-anchor="middle" class="h" style="fill:var(--green)">SAFE</text>
<text x="884" y="357" font-size="12" class="" >old content: write</text>
<rect x="796" y="370" width="78" height="20" rx="10" stroke-width="1" style="fill:var(--amber-bg);stroke:var(--amber)"/><text x="835" y="384" font-size="11" text-anchor="middle" class="h" style="fill:var(--amber)">COLLIDE</text>
<text x="884" y="385" font-size="12" class="" >edit on disk: refuse by default</text>
<path d="M752,160 C766,160 766,160 780,160" class="wire" marker-end="url(#arrow)"/>
<path d="M928,234 L928,256" class="wire" marker-end="url(#arrow)"/>
<text x="24" y="446" font-size="12.5" class="muted" >Facts come from git. A branch is merged only when someone can say why it exists. Nothing checks out, stashes or resets a shared working tree.</text>
</svg>
