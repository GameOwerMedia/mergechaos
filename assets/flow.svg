<path d="M278,270 h18 l6,6 v26 h-24 z" fill="none" stroke-width="1.5" style="stroke:var(--red)"/>
<text x="312" y="283" font-size="12.5" class="h" style="fill:var(--red)">no report</text>
<text x="312" y="303" font-size="12" class="muted" >purpose unknown</text>
<path d="M224,288 C243,288 243,288 262,288" class="wire" marker-end="url(#arrow)"/>
<rect x="24" y="342" width="200" height="64" rx="8" class="card" />
<circle cx="44" cy="364" r="6" style="fill:var(--purple)"/>
<text x="58" y="368" font-size="13" class="mono h" >agent-d/typo</text>
<text x="38" y="390" font-size="12" class="muted" >cherry-picked to main</text>
