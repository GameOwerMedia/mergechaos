<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="t">
<title id="t">Many agents leave branches; premerge reports say why; mergechaos plans TAKE, ASK or ARCHIVE, integrates in a separate worktree and lands without overwriting uncommitted work</title>
<style>
  :root { --bg:#f6f8fa; --card:#ffffff; --line:#d0d7de; --fg:#1f2328; --muted:#59636e; --blue:#0969da; --green:#1a7f37; --amber:#9a6700; --red:#cf222e; --purple:#8250df;
          --blue-bg:#ddf4ff; --green-bg:#dafbe1; --amber-bg:#fff8c5; --red-bg:#ffebe9; --purple-bg:#fbefff; --term:#0d1117; --term-fg:#e6edf3; --term-muted:#9198a1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --muted:#9198a1; --blue:#4493f8; --green:#3fb950; --amber:#d29922; --red:#f85149; --purple:#ab7df8;
            --blue-bg:#0c2d6b; --green-bg:#0f3a1d; --amber-bg:#3b2e00; --red-bg:#4c1214; --purple-bg:#2e1a52; --term:#010409; }
  }
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .muted { fill: var(--muted); }
  .h { font-weight: 600; }
  .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .wire { stroke: var(--muted); stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker></defs>
<rect width="1100" height="470" rx="12" style="fill:var(--bg)"/>
<text x="24" y="40" font-size="16" class="h" >Agents</text>
<text x="24" y="60" font-size="11.5" class="muted mono" >branches, worktrees</text>
<text x="262" y="40" font-size="16" class="h" >premerge reports</text>
<text x="262" y="60" font-size="11.5" class="muted mono" >docs/premerge/&lt;branch&gt;.md</text>
<text x="520" y="40" font-size="16" class="h" >mergechaos plan</text>
<text x="520" y="60" font-size="11.5" class="muted mono" >one verdict per branch</text>
<text x="780" y="40" font-size="16" class="h" >integrate, then land</text>
<text x="780" y="60" font-size="11.5" class="muted mono" >separate worktree, then base</text>
