<rect x="520" y="84" width="232" height="322" rx="8" class="card" />
<rect x="536" y="104" width="76" height="20" rx="10" stroke-width="1" style="fill:var(--green-bg);stroke:var(--green)"/><text x="574" y="118" font-size="11" text-anchor="middle" class="h" style="fill:var(--green)">TAKE</text>
<text x="622" y="119" font-size="11.5" class="mono" >1. agent-a/cart</text>
<rect x="536" y="148" width="76" height="20" rx="10" stroke-width="1" style="fill:var(--green-bg);stroke:var(--green)"/><text x="574" y="162" font-size="11" text-anchor="middle" class="h" style="fill:var(--green)">TAKE</text>
<text x="622" y="163" font-size="11.5" class="mono" >2. agent-b/checkout</text>
<rect x="536" y="192" width="76" height="20" rx="10" stroke-width="1" style="fill:var(--amber-bg);stroke:var(--amber)"/><text x="574" y="206" font-size="11" text-anchor="middle" class="h" style="fill:var(--amber)">ASK</text>
<text x="622" y="207" font-size="11.5" class="mono" >agent-c/theme</text>
<rect x="536" y="236" width="76" height="20" rx="10" stroke-width="1" style="fill:var(--purple-bg);stroke:var(--purple)"/><text x="574" y="250" font-size="11" text-anchor="middle" class="h" style="fill:var(--purple)">ARCHIVE</text>
<text x="622" y="251" font-size="11.5" class="mono" >agent-d/typo</text>
<line x1="536" y1="290" x2="736" y2="290" style="stroke:var(--line)"/>
<text x="536" y="312" font-size="12" class="h" >Rescue before landing:</text>
<text x="536" y="332" font-size="12" class="mono" >agent-c worktree</text>
<text x="536" y="350" font-size="11" class="mono muted" >-&gt; rescue/acme-shop-theme/&lt;date&gt;</text>
<text x="536" y="376" font-size="12" class="h" >Questions for the owner:</text>
<text x="536" y="394" font-size="11.5" class="muted" >ASK agent-c: why does it exist?</text>
<path d="M472,116 C496,116 496,114 520,114" class="wire" marker-end="url(#arrow)"/>
<path d="M472,202 C496,202 496,158 520,158" class="wire" marker-end="url(#arrow)"/>
