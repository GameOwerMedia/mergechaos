<text x="58" y="196" font-size="13" class="mono h" >agent-b/checkout</text>
<text x="38" y="218" font-size="12" class="muted" >committed</text>
<rect x="262" y="170" width="210" height="64" rx="8" class="card" />
<path d="M278,184 h18 l6,6 v26 h-24 z" fill="none" stroke-width="1.5" style="stroke:var(--green)"/>
<text x="312" y="197" font-size="12.5" class="" >why: checkout in USD</text>
<text x="312" y="217" font-size="12" class="muted" >depends on agent-a</text>
